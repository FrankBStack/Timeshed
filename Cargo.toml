[package]
name = "timeshed"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "timeshed"
required-features = ["native"]

[features]
default = ["native"]
# everything that needs an OS: file readers, the CLI, the server, threads
native = ["dep:axum", "dep:clap", "dep:csv", "dep:env_logger", "dep:osmpbf", "dep:rand", "dep:rayon", "dep:tokio", "dep:tower-http", "dep:zip"]
# the routing core compiled for the browser
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
anyhow = "1.0.104"
bincode = "1"
chrono = { version = "0.4.45", features = ["serde"] }
contour = "0.13.1"
log = "0.4.34"
rstar = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

axum = { version = "0.8.9", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
csv = { version = "1.4.0", optional = true }
env_logger = { version = "0.11.11", optional = true }
osmpbf = { version = "0.3.8", optional = true }
rand = { version = "0.9", optional = true }
rayon = { version = "1.12.0", optional = true }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"], optional = true }
tower-http = { version = "0.7.1", features = ["fs", "cors"], optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }

wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
rand = "0.9"

[profile.release]
lto = "thin"
