<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The header mark, cut for tab size: a solid tile, one ring and the centre dot.
       Same proportions as the inner two rings of .mark in index.html; the tile edge
       stands in for the faint outer ring. apple-touch-icon.png is this with rx="0". -->
  <rect width="64" height="64" rx="14" fill="#1c5cab"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="5.5"/>
  <circle cx="32" cy="32" r="6.5" fill="#fff"/>
</svg>
