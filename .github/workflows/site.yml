name: site
# Builds and deploys the site for every city in cities.json: downloads each
# agency's current schedule, reuses a monthly-cached OSM extract, rebuilds the
# bundles and the wasm, renders the pages, smoke-tests them in a browser, and
# ships docs/ to Cloudflare Pages. Runs on relevant pushes, every Monday so new
# schedules are picked up, and on demand. Refuses to deploy a feed that does
# not cover the coming week, so an expiring feed fails loudly instead of
# leaving a city's live map routing nothing.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "src/**"
      - "cities.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/data/**"
      - "docs/figures/**"
      - "docs/_headers"
      - ".github/workflows/site.yml"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Month stamp for the OSM cache
        id: month
        run: echo "stamp=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache the OSM extracts, refreshed monthly
        uses: actions/cache@v4
        with:
          path: data/raw/osm
          key: osm-${{ hashFiles('cities.json') }}-${{ steps.month.outputs.stamp }}
      - name: Build the engine
        run: cargo build --release
      - name: Download feeds and extracts, build a bundle per city
        run: |
          set -eu
          mkdir -p data/raw/osm data/raw/gtfs data/bundles
          python3 - <<'EOF' > cities.tsv
          import json
          for k, c in json.load(open("cities.json")).items():
              print("\t".join([k, c["gtfs"], c["osm"], c["osm_cache"], c["agency"]]))
          EOF
          args=""
          while IFS=$'\t' read -r key gtfs osm cache agency; do
            echo "== $key"
            pbf="data/raw/osm/$cache.osm.pbf"
            [ -s "$pbf" ] || curl -fsSL "$osm" -o "$pbf"
            curl -fsSL "$gtfs" -o "data/raw/gtfs/$key.zip"
            for days in 0 7; do
              d=$(date -u -d "+$days days" +%F)
              line=$(./target/release/timeshed inspect "data/raw/gtfs/$key.zip" --date "$d" | tail -1)
              echo "$line"
              trips=$(echo "$line" | sed -nE 's/.*services, ([0-9]+) trips.*/\1/p')
              if [ -z "$trips" ] || [ "$trips" -lt 100 ]; then
                echo "::error::$key: the feed has ${trips:-0} trips on $d; not deploying"
                exit 1
              fi
            done
            ./target/release/timeshed build --gtfs "data/raw/gtfs/$key.zip" --osm "$pbf" --name "$agency" -o "data/bundles/$key.bin"
            args="$args $key=data/bundles/$key.bin"
          done < cities.tsv
          echo "BUNDLE_ARGS=$args" >> "$GITHUB_ENV"
      - name: Render the site
        run: scripts/build-web.sh $BUNDLE_ARGS
      - name: Smoke-test the built site in a browser
        run: |
          npm --prefix scripts install --silent --no-package-lock
          node scripts/smoke.mjs docs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=timeshed --branch=main
